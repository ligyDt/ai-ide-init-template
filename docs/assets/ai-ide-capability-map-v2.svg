    <text class="section-title" x="310" y="48" text-anchor="middle">④ 自动化执行层</text>
    <rect class="box blue" x="0" y="96" width="292" height="104"/>
    <text class="card-title" x="146" y="136" text-anchor="middle">Agent 编排</text>
    <text class="card-text" x="146" y="171" text-anchor="middle">多步任务 / 回滚 / 重试</text>
    <rect class="box blue" x="328" y="96" width="292" height="104"/>
    <text class="card-title" x="474" y="136" text-anchor="middle">MCP 工具集</text>
    <text class="card-text" x="474" y="171" text-anchor="middle">文件 / 终端 / 浏览器 / DB</text>
    <rect class="box blue" x="0" y="220" width="292" height="104"/>
    <text class="card-title" x="146" y="260" text-anchor="middle">Hook 系统</text>
    <text class="card-text" x="146" y="295" text-anchor="middle">pre / post 事件触发</text>
    <rect class="box blue" x="328" y="220" width="292" height="104"/>
    <text class="card-title" x="474" y="260" text-anchor="middle">Skill 库</text>
    <text class="card-text" x="474" y="295" text-anchor="middle">可复用专项操作包</text>
  </g>

  <g transform="translate(60,870)">
    <rect class="box red" width="620" height="76"/>
    <text class="section-title" x="310" y="48" text-anchor="middle">⑤ 安全与合规层</text>
    <rect class="box red" x="0" y="96" width="292" height="104"/>
    <text class="card-title" x="146" y="136" text-anchor="middle">权限沙箱</text>
    <text class="card-text" x="146" y="171" text-anchor="middle">最小权限 / 审批流</text>
    <rect class="box red" x="328" y="96" width="292" height="104"/>
    <text class="card-title" x="474" y="136" text-anchor="middle">敏感信息防泄漏</text>
    <text class="card-text" x="474" y="171" text-anchor="middle">密钥 / PII 扫描屏蔽</text>
    <rect class="box red" x="0" y="220" width="292" height="104"/>
    <text class="card-title" x="146" y="260" text-anchor="middle">操作审计日志</text>
    <text class="card-text" x="146" y="295" text-anchor="middle">可追溯 / 不可篡改</text>
    <rect class="box red" x="328" y="220" width="292" height="104"/>
    <text class="card-title" x="474" y="260" text-anchor="middle">合规 / 许可证检查</text>
    <text class="card-text" x="474" y="295" text-anchor="middle">OSS license / GDPR</text>
  </g>

  <g transform="translate(720,870)">
    <rect class="box amber" width="620" height="76"/>
    <text class="section-title" x="310" y="48" text-anchor="middle">⑥ 学习与自进化层</text>
    <rect class="box amber" x="0" y="96" width="292" height="104"/>
    <text class="card-title" x="146" y="136" text-anchor="middle">错误免疫机制</text>
    <text class="card-text" x="146" y="171" text-anchor="middle">沟通中解决过不再犯</text>
    <rect class="box amber" x="328" y="96" width="292" height="104"/>
    <text class="card-title" x="474" y="136" text-anchor="middle">用户反馈闭环</text>
    <text class="card-text" x="474" y="171" text-anchor="middle">thumbs / inline 纠偏</text>
    <rect class="box amber" x="0" y="220" width="292" height="104"/>
    <text class="card-title" x="146" y="260" text-anchor="middle">规则自动沉淀</text>
    <text class="card-text" x="146" y="295" text-anchor="middle">对话 → 规范 → 规则库</text>
    <rect class="box amber" x="328" y="220" width="292" height="104"/>
    <text class="card-title" x="474" y="260" text-anchor="middle">知识蒸馏</text>
    <text class="card-text" x="474" y="295" text-anchor="middle">项目最佳实践提炼</text>
  </g>

  <g transform="translate(60,1230)">
    <rect class="box lime" width="620" height="76"/>
    <text class="section-title" x="310" y="48" text-anchor="middle">⑦ 协同与沟通层</text>
    <rect class="box lime" x="0" y="96" width="292" height="104"/>
    <text class="card-title" x="146" y="136" text-anchor="middle">多 Agent 协作</text>
    <text class="card-text" x="146" y="171" text-anchor="middle">任务分配 / 结果合并</text>
    <rect class="box lime" x="328" y="96" width="292" height="104"/>
    <text class="card-title" x="474" y="136" text-anchor="middle">人机交接协议</text>
    <text class="card-text" x="474" y="171" text-anchor="middle">置信度低时升级人工</text>
    <rect class="box lime" x="0" y="220" width="292" height="104"/>
    <text class="card-title" x="146" y="260" text-anchor="middle">沟通风格配置</text>
    <text class="card-text" x="146" y="295" text-anchor="middle">详细 / 简洁 / 提问优先</text>
    <rect class="box lime" x="328" y="220" width="292" height="104"/>
    <text class="card-title" x="474" y="260" text-anchor="middle">PR / Review 集成</text>
    <text class="card-text" x="474" y="295" text-anchor="middle">代码审查 / 注释生成</text>
  </g>

  <g transform="translate(720,1230)">
    <rect class="box gray" width="620" height="76"/>
    <text class="section-title" x="310" y="48" text-anchor="middle">⑧ 平台与可观测层</text>
    <rect class="box gray" x="0" y="96" width="292" height="104"/>
    <text class="card-title" x="146" y="136" text-anchor="middle">成本 / Token 监控</text>
    <text class="card-text" x="146" y="171" text-anchor="middle">用量 / 预算 / 限流</text>
    <rect class="box gray" x="328" y="96" width="292" height="104"/>
    <text class="card-title" x="474" y="136" text-anchor="middle">延迟 / 质量评估</text>
    <text class="card-text" x="474" y="171" text-anchor="middle">响应速度 / 准确率</text>
    <rect class="box gray" x="0" y="220" width="292" height="104"/>
    <text class="card-title" x="146" y="260" text-anchor="middle">多模型路由</text>
    <text class="card-text" x="146" y="295" text-anchor="middle">任务 → 最优模型</text>
    <rect class="box gray" x="328" y="220" width="292" height="104"/>
    <text class="card-title" x="474" y="260" text-anchor="middle">离线 / 本地模式</text>
    <text class="card-text" x="474" y="295" text-anchor="middle">隐私 / 断网降级</text>
  </g>

  <g transform="translate(60,1620)">
    <rect class="box purple" x="0" y="0" width="300" height="96"/>
    <text class="card-title" x="150" y="39" text-anchor="middle">Prompt 模板库</text>
    <text class="card-text" x="150" y="73" text-anchor="middle">标准化输入范式</text>

    <rect class="box green" x="326" y="0" width="300" height="96"/>
    <text class="card-title" x="476" y="39" text-anchor="middle">TDD / 测试生成</text>
    <text class="card-text" x="476" y="73" text-anchor="middle">单测 / 覆盖率追踪</text>

    <rect class="box brown" x="652" y="0" width="300" height="96"/>
    <text class="card-title" x="802" y="39" text-anchor="middle">性能分析与重构</text>
    <text class="card-text" x="802" y="73" text-anchor="middle">复杂度 / 热点定位</text>

    <rect class="box blue" x="978" y="0" width="300" height="96"/>
    <text class="card-title" x="1128" y="39" text-anchor="middle">多语言 / i18n 支持</text>
    <text class="card-text" x="1128" y="73" text-anchor="middle">本地化 / 时区处理</text>

    <rect class="box red" x="0" y="120" width="300" height="96"/>
    <text class="card-title" x="150" y="159" text-anchor="middle">文档自动生成</text>
    <text class="card-text" x="150" y="193" text-anchor="middle">README / API doc</text>

    <rect class="box amber" x="326" y="120" width="300" height="96"/>
    <text class="card-title" x="476" y="159" text-anchor="middle">依赖漏洞扫描</text>
    <text class="card-text" x="476" y="193" text-anchor="middle">SCA / CVE 检测</text>

    <rect class="box lime" x="652" y="120" width="300" height="96"/>
    <text class="card-title" x="802" y="159" text-anchor="middle">CI/CD 深度集成</text>
    <text class="card-text" x="802" y="193" text-anchor="middle">流水线感知 / 修复</text>

    <rect class="box gray" x="978" y="120" width="300" height="96"/>
    <text class="card-title" x="1128" y="159" text-anchor="middle">Monorepo 感知</text>
    <text class="card-text" x="1128" y="193" text-anchor="middle">跨包依赖 / 影响分析</text>
  </g>

  <text class="small" x="700" y="1900" text-anchor="middle">本图为模板能力全景，具体落地以各工具原生配置、非生产验证和用户明确授权为边界。</text>
</svg>
