<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1960" viewBox="0 0 1400 1960" role="img" aria-labelledby="title desc">
  <title id="title">AI IDE 初始化工具能力配置全景地图</title>
  <desc id="desc">覆盖 Codex、Cursor、CodeBuddy、TRAE 的 8 大能力层和 8 项补充能力。</desc>
  <style>
    .bg { fill: #07090f; }
    .title { fill: #f8fafc; font: 700 40px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #cbd5e1; font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .section-title { fill: #f8fafc; font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card-title { fill: #f8fafc; font: 700 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card-text { fill: #dbeafe; font: 500 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #cbd5e1; font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { fill: #f8fafc; font: 700 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .box { rx: 14; ry: 14; stroke-width: 2; }
    .purple { fill: #40358f; stroke: #a5b4fc; }
    .green { fill: #064e3b; stroke: #34d399; }
    .brown { fill: #7c2d12; stroke: #fb923c; }
    .blue { fill: #164e82; stroke: #60a5fa; }
    .red { fill: #7f1d1d; stroke: #f87171; }
    .amber { fill: #783f04; stroke: #f59e0b; }
    .lime { fill: #21570a; stroke: #84cc16; }
    .gray { fill: #3f3f46; stroke: #a1a1aa; }
  </style>

  <rect class="bg" width="1400" height="1960"/>
  <text class="title" x="700" y="62" text-anchor="middle">AI IDE 初始化工具 · 能力配置全景地图</text>
  <text class="subtitle" x="700" y="102" text-anchor="middle">8 大维度 · 覆盖 Codex / Cursor / CodeBuddy / TRAE</text>

  <g transform="translate(60,150)">
