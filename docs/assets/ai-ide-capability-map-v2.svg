    <text class="section-title" x="310" y="48" text-anchor="middle">① 认知与上下文层</text>
    <rect class="box purple" x="0" y="96" width="292" height="104"/>
    <text class="card-title" x="146" y="136" text-anchor="middle">记忆系统</text>
    <text class="card-text" x="146" y="171" text-anchor="middle">短期 / 长期 / 项目级</text>
    <rect class="box purple" x="328" y="96" width="292" height="104"/>
    <text class="card-title" x="474" y="136" text-anchor="middle">上下文管理</text>
    <text class="card-text" x="474" y="171" text-anchor="middle">窗口策略 / 压缩 / 优先级</text>
    <rect class="box purple" x="0" y="220" width="292" height="104"/>
    <text class="card-title" x="146" y="260" text-anchor="middle">项目知识图谱</text>
    <text class="card-text" x="146" y="295" text-anchor="middle">架构 / 依赖 / 领域词表</text>
    <rect class="box purple" x="328" y="220" width="292" height="104"/>
    <text class="card-title" x="474" y="260" text-anchor="middle">意图理解</text>
    <text class="card-text" x="474" y="295" text-anchor="middle">歧义消解 / 需求拆解</text>
  </g>

  <g transform="translate(720,150)">
    <rect class="box green" width="620" height="76"/>
    <text class="section-title" x="310" y="48" text-anchor="middle">② 角色与人格层</text>
    <rect class="box green" x="0" y="96" width="292" height="104"/>
    <text class="card-title" x="146" y="136" text-anchor="middle">研发角色矩阵</text>
    <text class="card-text" x="146" y="171" text-anchor="middle">前端 / 后端 / 架构 / SRE</text>
    <rect class="box green" x="328" y="96" width="292" height="104"/>
    <text class="card-title" x="474" y="136" text-anchor="middle">语言专家角色</text>
    <text class="card-text" x="474" y="171" text-anchor="middle">Java / Go / Python / C++</text>
    <rect class="box green" x="0" y="220" width="292" height="104"/>
    <text class="card-title" x="146" y="260" text-anchor="middle">设计 / 测试角色</text>
    <text class="card-text" x="146" y="295" text-anchor="middle">UI / UX / QA / 安全审计</text>
    <rect class="box green" x="328" y="220" width="292" height="104"/>
    <text class="card-title" x="474" y="260" text-anchor="middle">角色切换协议</text>
    <text class="card-text" x="474" y="295" text-anchor="middle">场景感知 / 自动切换</text>
  </g>

  <g transform="translate(60,510)">
    <rect class="box brown" width="620" height="76"/>
    <text class="section-title" x="310" y="48" text-anchor="middle">③ 工程规范与约束层</text>
    <rect class="box brown" x="0" y="96" width="292" height="104"/>
    <text class="card-title" x="146" y="136" text-anchor="middle">代码规范 / 风格</text>
    <text class="card-text" x="146" y="171" text-anchor="middle">lint / format / naming</text>
    <rect class="box brown" x="328" y="96" width="292" height="104"/>
    <text class="card-title" x="474" y="136" text-anchor="middle">边界与禁令清单</text>
    <text class="card-text" x="474" y="171" text-anchor="middle">禁止包 / 危险操作清单</text>
    <rect class="box brown" x="0" y="220" width="292" height="104"/>
    <text class="card-title" x="146" y="260" text-anchor="middle">提交 / 分支规范</text>
    <text class="card-text" x="146" y="295" text-anchor="middle">Conventional Commits</text>
    <rect class="box brown" x="328" y="220" width="292" height="104"/>
    <text class="card-title" x="474" y="260" text-anchor="middle">架构决策记录</text>
    <text class="card-text" x="474" y="295" text-anchor="middle">ADR / 技术债标记</text>
  </g>

  <g transform="translate(720,510)">
